name: Verify ordinary cloud browser access
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum npm run probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-access-proof
          path: proof/
          retention-days: 7
